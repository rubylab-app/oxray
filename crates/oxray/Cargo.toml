[package]
name = "oxray"
version = "0.0.0"
description = "Request inspector for Axum applications."
repository = "https://github.com/rubylab-app/oxray"
authors = ["The Oxray Authors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
__fault-injection = []
reqwest = ["dep:reqwest", "dep:reqwest-middleware", "dep:async-trait"]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
axum = "0.8"
bytes = "1.12.1"
futures-util = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
percent-encoding = "2.3.2"
pin-project-lite = "0.2.17"
reqwest = { version = "0.13.5", default-features = false, optional = true }
reqwest-middleware = { version = "0.5.2", optional = true }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "env-filter"] }
uuid = { version = "1.26.1", features = ["v7"] }

[[bench]]
name = "overhead"
harness = false

[dev-dependencies]
proptest = "1.12.0"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["full", "macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
