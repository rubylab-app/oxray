name: harness-guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: harness-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: harness-guard
    runs-on: ubuntu-latest
    steps:
      - name: Compare protected paths from the base branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request

          repo = os.environ["REPO"]
          base = os.environ["BASE_REF"]
          number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]

          def api(path):
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "oxray-harness-guard",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          payload = api(f"/repos/{repo}/contents/harness.toml?ref={base}")
          text = base64.b64decode(payload["content"]).decode()
          try:
              import tomllib
          except ImportError:
              raise SystemExit("tomllib is required")
          harness = tomllib.loads(text)
          patterns = harness["protected"]["paths"]

          changed = []
          page = 1
          while True:
              batch = api(f"/repos/{repo}/pulls/{number}/files?per_page=100&page={page}")
              if not batch:
                  break
              for item in batch:
                  changed.append(item["filename"])
                  previous = item.get("previous_filename")
                  if previous:
                      changed.append(previous)
              if len(batch) < 100:
                  break
              page += 1

          def matches(path, pattern):
              if pattern.endswith("/**"):
                  prefix = pattern[:-3]
                  return path == prefix or path.startswith(prefix + "/")
              path_parts = path.split("/")
              pattern_parts = pattern.split("/")
              if len(path_parts) != len(pattern_parts):
                  return False
              for path_part, pattern_part in zip(path_parts, pattern_parts):
                  if "*" not in pattern_part:
                      if path_part != pattern_part:
                          return False
                      continue
                  prefix, suffix = pattern_part.split("*", 1)
                  if not (path_part.startswith(prefix) and path_part.endswith(suffix) and len(path_part) >= len(prefix) + len(suffix)):
                      return False
              return True

          hits = sorted({path for path in changed if any(matches(path, pattern) for pattern in patterns)})
          labels = [label["name"] for label in api(f"/repos/{repo}/pulls/{number}")["labels"]]
          if hits and "harness-change-approved" not in labels:
              print("Protected paths changed without harness-change-approved:")
              for hit in hits:
                  print(f"- {hit}")
              raise SystemExit(1)
          if hits:
              print("Protected paths changed and harness-change-approved is present.")
          else:
              print("No protected paths changed.")
          PY
