[protected]
paths = [
  "xtask/**",
  "harness.toml",
  ".github/**",
  ".cargo/**",
  "Cargo.toml",
  "deny.toml",
  "clippy.toml",
  "rustfmt.toml",
  "rust-toolchain.toml",
  ".nvmrc",
  "crates/oxray/build.rs",
  "crates/oxray/tests/mandatory/**",
  "crates/oxray/tests/fixtures/sensitive_corpus.json",
  "ui/biome.json",
  "ui/tsconfig*.json",
  "ui/vite.config.ts",
  "ui/vitest.config.ts",
  "ui/playwright.config.ts",
  "ui/src/styles/tokens.css",
  "ui/tests/mandatory/**",
  "xtask/src/contrast.rs",
]

[hygiene]
exclude = [
  "Cargo.lock",
  "ui/package-lock.json",
  "crates/oxray/ui-dist/**",
  "xtask/src/hygiene.rs",
]

