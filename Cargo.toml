[workspace]
resolver = "3"
members = ["crates/oxray", "xtask", "examples/demo"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[profile.bench-dev]
inherits = "dev"
opt-level = 3
debug-assertions = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
